plugins {
  id 'com.android.application'
}

android {
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildFeatures {
    buildConfig true
  }

  namespace "your.pkg.aaguard"
  compileSdk 34

  defaultConfig {
    applicationId "your.pkg.aaguard"
    minSdk 24
    targetSdk 34
    versionCode 2
    versionName "2.0"

    buildConfigField "String", "PREFS_NAME", "\"aaguard_prefs\""
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    debug {
      minifyEnabled false
    }
  }

  packagingOptions {
    resources {
      excludes += ['META-INF/*']
    }
  }
}

dependencies {
  compileOnly 'de.robv.android.xposed:api:82'
  testImplementation 'junit:junit:4.13.2'
}
